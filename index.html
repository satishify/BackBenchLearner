<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BackbenchLearner offers beginner-friendly notes on backend systems, Gen AI, deep learning, and agentic AI with diagrams and practical examples.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://backbenchlearner.com/index.html">
  <meta property="og:title" content="BackbenchLearner">
  <meta property="og:description" content="Backend systems, Gen AI, deep learning, and agentic AI notes with diagrams and examples.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://backbenchlearner.com/">
  <meta property="og:image" content="https://backbenchlearner.com/assets/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="BackbenchLearner — Learn · Build · Level up">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BackbenchLearner">
  <meta name="twitter:description" content="Backend systems, Gen AI, deep learning, and agentic AI notes with diagrams and examples.">
  <meta name="twitter:image" content="https://backbenchlearner.com/assets/og-card.png">
  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <title>BackbenchLearner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --link: #0f766e;
      --link-read: #475569;
      --active: #0f766e;
      --sidebar-bg: #f8fafc;
      --sidebar-border: #e2e8f0;
      --header-bg: #ffffff;
      --header-bg-solid: #ffffff;
      --header-text: #0f172a;
      --header-link: #334155;
      --header-active-bg: rgba(15, 118, 110, 0.1);
      --accent-soft: rgba(15, 118, 110, 0.12);
      --done: #0f766e;
      --danger: #b91c1c;
      --brand: #0f766e;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      max-height: 100%;
      height: 100dvh;
      max-height: 100dvh;
    }
    body {
      margin: 0;
      font-family: 'Source Serif 4', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .page-header {
      background: var(--header-bg);
      background-color: var(--header-bg-solid);
      color: var(--header-text);
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 120;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1.5rem;
      padding: 0.7rem 1.25rem;
      width: 100%;
      margin: 0;
      max-width: none;
    }
    .brand-block {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      min-width: 0;
    }
    .site-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--header-text);
      min-width: 0;
    }
    .site-logo:hover { opacity: 0.9; }
    .site-logo-mark {
      display: block;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 9px;
    }
    .site-logo-text {
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
      min-width: 0;
      line-height: 1.15;
    }
    .site-logo-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--brand);
      white-space: nowrap;
    }
    .site-logo-tag {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      .site-logo-mark { width: 32px; height: 32px; }
      .site-logo-name { font-size: 0.95rem; }
      .site-logo-tag { display: none; }
    }
    .main-nav {
      display: flex;
      align-items: center;
      gap: 0.15rem;
      flex: 1 1 auto;
      min-width: 0;
    }
    .nav-item {
      position: relative;
    }
    .nav-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 0.8rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--header-link);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
    }
    .nav-trigger:hover,
    .nav-item.open .nav-trigger,
    .nav-trigger.active {
      background: var(--header-active-bg);
      color: var(--brand);
    }
    .nav-trigger .nav-caret {
      font-size: 0.65rem;
      opacity: 0.7;
      transition: transform 0.15s ease;
    }
    .nav-item.open .nav-caret { transform: rotate(180deg); }
    .nav-icon {
      width: 1.05rem;
      height: 1.05rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .nav-icon svg { width: 100%; height: 100%; display: block; }
    .mega-menu {
      display: none;
      position: absolute;
      top: calc(100% + 0.45rem);
      left: 0;
      min-width: 360px;
      max-width: min(520px, 92vw);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      padding: 0.85rem;
      z-index: 130;
    }
    .nav-item.open .mega-menu { display: block; }
    .mega-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0.25rem 0.55rem 0.55rem;
    }
    .mega-menu .mega-label:not(:first-child) {
      margin-top: 0.85rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .mega-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.2rem;
    }
    .mega-list a {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.7rem 0.65rem;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
    }
    .mega-list a:hover,
    .mega-list a.active {
      background: rgba(15, 118, 110, 0.08);
    }
    .mega-list a.active .mega-title { color: var(--brand); }
    .mega-item-icon {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--brand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mega-item-icon svg { width: 1.15rem; height: 1.15rem; }
    .mega-title {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .mega-desc {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
      line-height: 1.35;
    }
    .mega-footer {
      margin-top: 0.55rem;
      padding-top: 0.55rem;
      border-top: 1px solid var(--border);
    }
    .mega-footer a {
      display: block;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--brand);
      text-decoration: none;
      padding: 0.65rem;
      border-radius: 8px;
      background: rgba(15, 118, 110, 0.08);
    }
    .mega-footer a:hover { background: rgba(15, 118, 110, 0.14); }
    .nav-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 110;
      background: transparent;
    }
    .nav-backdrop.visible { display: block; }
    .content-row {
      display: flex;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      padding: 1rem 0.9rem;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      flex-shrink: 0;
    }
    .sidebar-summary {
      background: #ffffff;
      border: 1px solid var(--sidebar-border);
      border-radius: 10px;
      padding: 0.9rem 0.95rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .sidebar-summary-pct {
      font-family: 'DM Sans', 'JetBrains Mono', sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }
    .sidebar-summary-pct span {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .sidebar-summary-meta,
    .sidebar-summary-site {
      font-family: 'DM Sans', 'JetBrains Mono', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }
    .sidebar-summary-site { margin-top: 0.45rem; font-weight: 500; }
    .progress-bar {
      display: block;
      height: 4px;
      background: rgba(15, 118, 110, 0.14);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.45rem;
    }
    .progress-bar-fill {
      display: block;
      height: 100%;
      background: var(--active);
      border-radius: 999px;
      transition: width 0.2s ease;
    }
    /* Tree: Module → Chapter → Lesson (progressive indent + guide rail) */
    .sidebar .module { margin-top: 0.9rem; }
    .sidebar .module:first-of-type { margin-top: 0; }
    .sidebar .module-toggle,
    .sidebar .chapter-toggle {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.35rem;
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: left;
      padding: 0.45rem 0.3rem;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'DM Sans', 'JetBrains Mono', sans-serif;
      border-radius: 6px;
    }
    .sidebar .module-toggle:hover,
    .sidebar .chapter-toggle:hover {
      background: rgba(15, 118, 110, 0.08);
    }
    .sidebar .module-toggle {
      font-size: 1rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.015em;
      padding-left: 0.15rem;
    }
    .sidebar .module-body {
      display: none;
      margin: 0.2rem 0 0.35rem 0.55rem;
      padding-left: 0.65rem;
      border-left: 2px solid #cbd5e1;
    }
    .sidebar .module-body.expanded { display: block; }
    .sidebar .module-body .chapter { margin-top: 0.35rem; }
    .sidebar .module-body .chapter:first-child { margin-top: 0.1rem; }
    .sidebar .chapter-toggle {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
      padding: 0.4rem 0.25rem;
    }
    .sidebar .chapter-toggle-main { flex: 1; min-width: 0; }
    .sidebar .chapter-title { display: block; line-height: 1.35; font-weight: 700; }
    .sidebar .chapter-meta {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }
    .sidebar .chapter-caret {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }
    .sidebar .module-toggle[aria-expanded="true"] .chapter-caret,
    .sidebar .chapter-toggle[aria-expanded="true"] .chapter-caret {
      transform: rotate(90deg);
    }
    .sidebar .chapter { margin-top: 0.45rem; }
    .sidebar .chapter-links {
      display: none;
      margin: 0.15rem 0 0.25rem 0.45rem;
      padding-left: 0.55rem;
      border-left: 2px solid #e2e8f0;
    }
    .sidebar .module-body .chapter-links {
      margin-left: 0.2rem;
    }
    .sidebar .chapter-links.expanded { display: block; }
    .sidebar ul { list-style: none; padding: 0; margin: 0; }
    .sidebar li { margin: 0; }
    .sidebar a {
      font-family: 'DM Sans', 'JetBrains Mono', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      color: #1e293b;
      display: flex;
      align-items: flex-start;
      gap: 0.3rem;
      padding: 0.35rem 0.3rem;
      border-radius: 6px;
      line-height: 1.4;
    }
    .sidebar a:hover { background: rgba(15, 118, 110, 0.08); text-decoration: none; color: var(--active); }
    .sidebar a.active {
      color: var(--active);
      font-weight: 700;
      background: rgba(15, 118, 110, 0.12);
    }
    .sidebar a.read { color: #64748b !important; }
    .sidebar a.done { color: var(--done) !important; }
    .sidebar a.done .lesson-check,
    .sidebar a.quiz.done .lesson-check { color: var(--done); }
    .sidebar a.read.active,
    .sidebar a.done.active { color: var(--active) !important; }
    .sidebar .lesson-check {
      width: 0.9rem;
      flex-shrink: 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.72rem;
      line-height: 1.4;
    }
    .sidebar .lesson-num {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #0f766e;
      margin-right: 0.15rem;
    }
    .sidebar a.active .lesson-num { color: var(--active); }
    .sidebar a.done .lesson-num { color: var(--done); }
    .sidebar a.read .lesson-num { color: #94a3b8; }
    .sidebar .lesson-label { flex: 1; min-width: 0; }
    .sidebar .lesson-mins {
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .sidebar a.quiz .lesson-label { font-style: italic; }
    .main {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    #welcome {
      flex: 1 1 auto;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 2rem 2.5rem;
      max-width: 880px;
    }
    #welcome h1 { font-size: 1.75rem; margin: 0 0 0.5rem 0; color: var(--text); }
    #welcome .tagline { color: var(--text-muted); font-size: 1rem; margin-bottom: 1.5rem; }
    .practice-topic-heading {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin: 1.5rem 0 0.65rem;
    }
    .practice-topic-heading:first-of-type { margin-top: 0.5rem; }
    .dash-overview {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }
    .dash-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background:
        radial-gradient(closest-side, #fff 72%, transparent 73% 100%),
        conic-gradient(var(--active) calc(var(--pct, 0) * 1%), rgba(15, 118, 110, 0.14) 0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dash-ring strong {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      line-height: 1;
    }
    .dash-ring span {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .dash-stats {
      display: grid;
      gap: 0.55rem;
      flex: 1;
    }
    .dash-stats strong {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
    }
    .dash-stats span {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .dash-continue { margin: 0 0 1.5rem 0; }
    .dash-cta {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      background: var(--active);
      color: #fff !important;
      text-decoration: none !important;
      padding: 0.65rem 1rem;
      border-radius: 8px;
    }
    .dash-cta:hover { filter: brightness(1.05); }
    .dash-chapters {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .dash-chapter {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
    }
    .dash-chapter-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: baseline;
      margin-bottom: 0.15rem;
    }
    .dash-chapter-head strong { font-size: 0.95rem; }
    .dash-chapter-head span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .dash-quiz-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--done);
      margin-top: 0.4rem;
    }
    .dash-quiz-score.muted { color: var(--text-muted); }
    .dash-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .dash-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }
    .dash-btn:hover { border-color: var(--active); color: var(--active); }
    .dash-btn-danger { color: var(--danger); }
    .dash-btn-danger:hover { border-color: var(--danger); color: var(--danger); }
    .visitor-panel {
      position: fixed;
      top: 72px;
      right: 1rem;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
      font-size: 0.72rem;
      z-index: 80;
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 140px;
    }
    .visitor-panel.visible { display: flex; }
    .visitor-panel strong {
      display: block;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1;
    }
    .visitor-panel .label {
      display: block;
      color: var(--text-muted);
      font-size: 0.68rem;
      letter-spacing: 0.01em;
    }
    .visitor-unlock-btn {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 75;
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    .visitor-unlock-btn:hover {
      border-color: var(--active);
      color: var(--active);
    }
    .lesson-stage {
      flex: 1 1 auto;
      min-height: 0;
      display: none;
      width: 100%;
      background: var(--bg);
    }
    .lesson-stage.visible {
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }
    #content-frame {
      flex: 1 1 auto;
      width: 100%;
      border: none;
      min-height: 0;
      height: 100%;
      display: block;
      background: var(--bg);
    }
    #shell-lesson-rail {
      display: none;
      flex: 0 0 260px;
      width: 260px;
      min-width: 220px;
      max-width: 280px;
      padding: 1rem 0.85rem 1rem 0.35rem;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      border-left: 1px solid var(--border);
      background: #f8fafc;
    }
    #shell-lesson-rail.visible { display: block; }
    #shell-lesson-rail .reading-progress-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.95rem 1rem 1rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
      position: sticky;
      top: 0;
    }
    #shell-lesson-rail .reading-progress-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.45rem;
    }
    #shell-lesson-rail .reading-progress-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    #shell-lesson-rail .reading-progress-pct {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--brand);
    }
    #shell-lesson-rail .reading-progress-track {
      height: 5px;
      background: #e2e8f0;
      border-radius: 999px;
