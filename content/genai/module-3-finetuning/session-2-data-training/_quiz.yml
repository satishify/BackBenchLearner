title: "3.2 Data Prep & Training Mechanisms"
questions:
  - q: "During training, the model sees fixed-length token windows. What is the main reason for that design?"
    options:
      - "It makes the text easier for humans to read"
      - "It lets the model learn from only one document at a time"
      - "It turns the data into a form the GPU can process efficiently"
      - "It removes the need for tokenization"
    answer: 2
    why: "Fixed-length windows let the GPU batch work efficiently after tokenization."

  - q: "A model produces raw scores, then turns them into probabilities, then scores how wrong those probabilities are. Which pair matches that story?"
    options:
      - "Softmax, then cross-entropy"
      - "Backpropagation, then Adam"
      - "Cross-entropy, then softmax"
      - "Mini-batching, then tokenization"
    answer: 0
    why: "Softmax turns logits into probabilities; cross-entropy measures how wrong they are."

  - q: "One batch causes a huge jump in loss, but later batches partly recover. What failure mode is that?"
    options:
      - "No learning"
      - "Underfitting"
      - "Loss spike"
      - "Catastrophic forgetting"
    answer: 2
    why: "A sudden one-batch jump that later recovers is a loss spike."

  - q: "Which intervention most directly stops one very large gradient from blowing up the update?"
    options:
      - "Increase the number of epochs"
      - "Use gradient clipping"
      - "Remove warmup from the schedule"
      - "Switch to a larger context length"
    answer: 1
    why: "Clipping caps the update size while keeping the direction."

  - q: "A legal-domain fine-tune improves legal accuracy but general reasoning and coding get worse. What is the best name for that problem?"
    options:
      - "Data leakage"
      - "Gradient explosion"
      - "Domain shift"
      - "Catastrophic forgetting"
    answer: 3
    why: "That is classic catastrophic forgetting."

  - q: "You want the model to keep general ability while adapting to a narrow task, and you have some general instruction data. What is the most fitting mitigation?"
    options:
      - "Rehearsal with mixed general data"
      - "No warmup and a higher learning rate"
      - "Remove validation and train longer"
      - "Reduce the context length only"
    answer: 0
    why: "Rehearsal mixes a little general data into the fine-tune so old skills stay active."

  - q: "Which schedule usually gives productive steps early and very small steps at the end, with a smooth shape?"
    options:
      - "Constant schedule"
      - "Step decay"
      - "Cosine decay"
      - "No schedule at all"
    answer: 2
    why: "Cosine decay is smooth and leaves small steps near the end."

  - q: "A micro-batch of 2, gradient accumulation of 8, and 4 GPUs are used. What is the effective batch size?"
    options:
      - "14"
      - "32"
      - "64"
      - "128"
    answer: 2
    why: "2 x 8 x 4 = 64 examples influence one optimizer step."

  - q: "The loss curve jitters heavily from step to step and never settles. A sensible first fix is to:"
    options:
      - "Increase batch noise further"
      - "Increase effective batch size or lower the learning rate"
      - "Remove validation evaluation"
      - "Add more duplicates to the dataset"
    answer: 1
    why: "Persistent jitter usually means the batch is too small or the learning rate is too high."

  - q: "A model trained on many duplicate passages later regurgitates text word-for-word. Which data issue is most directly responsible?"
    options:
      - "Inconsistent formatting"
      - "Outdated information"
      - "Duplicates"
      - "Class imbalance"
    answer: 2
    why: "Duplicates amplify memorization and can cause regurgitation."

  - q: "In a time-series task, a random train/test split causes unrealistically good test scores. What went wrong?"
    options:
      - "The model underfit"
      - "The split leaked future information"
      - "The optimizer used Adam"
      - "The batch size was too small"
    answer: 1
    why: "Random splits on temporal data leak the future into training."

  - q: "Your training and validation losses are both high and flatten early. What diagnosis fits best?"
    options:
      - "Overfitting"
      - "Underfitting"
      - "Catastrophic forgetting"
      - "Gradient explosion"
    answer: 1
    why: "High and flat losses indicate underfitting or a failure to learn."

  - q: "The best reason to use a learning-rate warmup is that:"
    options:
      - "It helps the fragile beginning of training avoid large damaging updates"
      - "It makes the model larger"
      - "It removes the need for validation"
      - "It guarantees zero forgetting"
    answer: 0
    why: "Warmup protects the fragile early phase with small initial updates."

  - q: "You want to protect a pretrained model from drifting too far from its original solution. Which method explicitly penalizes that drift?"
    options:
      - "Stratified splitting"
      - "L2-SP or EWC-style regularization"
      - "Cosine restarts"
      - "Gradient accumulation"
    answer: 1
    why: "Those penalties keep weights closer to the pretrained starting point."

  - q: "What is the strongest overall takeaway about data prep and training?"
    options:
      - "Data quality, schedule choice, and stability controls matter more than one magical hyperparameter"
      - "The only thing that matters is the number of layers"
      - "Longer prompts always remove the need for fine-tuning"
      - "Every model should be fine-tuned for every task"
    answer: 0
    why: "Good data, stable training, and sane hyperparameters beat one trick."
